<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caio Alencar | CyberSecurity & Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030205;
            --card-bg: rgba(10, 8, 18, 0.9);
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --font-head: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sub);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines Cyberpunk */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(
                rgba(10, 8, 15, 0) 50%, 
                rgba(0, 0, 0, 0.4) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.02),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.02)
            );
            background-size: 100% 4px, 6px 100%;
            opacity: 0.85;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* --- MOLDURA LED COM RITMO SINCRONIZADO (EASE-IN-OUT) --- */
        .led-box {
            position: relative;
            width: 100%;
            border-radius: 22px;
            padding: 2px;
            overflow: hidden;
            background: rgba(18, 16, 32, 0.5);
            transition: transform 0.3s ease;
        }

        .led-box::before {
            content: '';
            position: absolute;
            top: -200%;
            left: -200%;
            width: 500%;
            height: 500%;
            background: conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                transparent 250deg,
                var(--neon-cyan) 310deg, 
                var(--neon-purple) 340deg, 
                var(--neon-pink) 360deg
            );
            /* Alterado para ease-in-out para que todos alterem a velocidade juntos em harmonia */
            animation: rotate-led 8s ease-in-out infinite;
        }

        @keyframes rotate-led {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .led-box:hover {
            transform: translateY(-3px) scale(1.01);
        }

        /* Conteúdo interno dos blocos */
        .led-content {
            position: relative;
            z-index: 2;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            overflow: hidden;
        }

        /* Profile Header */
        .profile-card {
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 16px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            animation: float-avatar 4s ease-in-out infinite;
        }

        @keyframes float-avatar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #030205;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.05);
            filter: contrast(1.1) brightness(1.1);
        }

        .profile-name {
            font-family: var(--font-head);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 6px;
        }

        .profile-tag {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .profile-bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 320px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Link Cards */
        .link-card {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--neon-cyan);
        }

        .link-card.highlight .icon-box {
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.1);
            border-color: rgba(255, 0, 127, 0.3);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .link-title {
            font-family: var(--font-head);
            font-size: 1rem;
            font-weight: 700;
        }

        .link-subtitle {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .arrow-icon {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* X.com Feed Box */
        .x-feed-card {
            width: 100%;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: var(--text-main);
        }

        .x-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .x-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-head);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .x-header-left i {
            color: var(--text-main);
            font-size: 1rem;
        }

        .x-handle {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--neon-cyan);
            text-decoration: none;
            transition: color 0.3s;
        }

        .x-handle:hover {
            color: var(--neon-pink);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-main);
            font-family: var(--font-sub);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn i {
            color: var(--neon-purple);
        }

        .footer {
            margin-top: 10px;
            text-align: center;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .social-row {
            display: flex;
            gap: 16px;
        }

        .social-link {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(10, 8, 18, 0.95);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            border-radius: 30px;
            padding: 10px 24px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <main class="main-container">
        <!-- 1. Caixa de Apresentação -->
        <div class="led-box">
            <div class="led-content">
                <section class="profile-card">
                    <div class="avatar-wrapper">
                        <img src="imagem.jpg" alt="Caio Alencar" class="avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Caio'">
                    </div>
                    
                    <h1 class="profile-name">CAIO ALENCAR</h1>
                    <span class="profile-tag">&lt;CyberSecurity & Developer/&gt;</span>
                    <p class="profile-bio">Criando experiências digitais interativas, automações e soluções de segurança web.</p>
                </section>
            </div>
        </div>

        <section class="links-container">
            <!-- 2. Botão GitHub -->
            <div class="led-box">
                <div class="led-content">
                    <a href="https://github.com/ocaioalencar" target="_blank" rel="noopener noreferrer" class="link-card highlight">
                        <div class="link-left">
                            <div class="icon-box"><i class="fa-brands fa-github"></i></div>
                            <div class="link-info">
                                <span class="link-title">GitHub</span>
                                <span class="link-subtitle">@ocaioalencar</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </div>
            </div>

            <!-- 3. Botão Instagram -->
            <div class="led-box">
                <div class="led-content">
                    <a href="https://instagram.com/ocaioalencar" target="_blank" rel="noopener noreferrer" class="link-card">
                        <div class="link-left">
                            <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                            <div class="link-info">
                                <span class="link-title">Instagram</span>
                                <span class="link-subtitle">@ocaioalencar</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </div>
            </div>

            <!-- 4. Botão Facebook -->
            <div class="led-box">
                <div class="led-content">
                    <a href="https://facebook.com/ocaioalencar1" target="_blank" rel="noopener noreferrer" class="link-card">
                        <div class="link-left">
                            <div class="icon-box"><i class="fa-brands fa-facebook"></i></div>
                            <div class="link-info">
                                <span class="link-title">Facebook</span>
                                <span class="link-subtitle">@ocaioalencar1</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </div>
            </div>

            <!-- 5. Caixa do Tweet do X -->
            <div class="led-box">
                <div class="led-content">
                    <div class="x-feed-card">
                        <div class="x-header">
                            <div class="x-header-left">
                                <i class="fa-brands fa-x-twitter"></i>
                                <span>Último Tweet</span>
                            </div>
                            <a href="https://x.com/ocaioalencar" target="_blank" rel="noopener noreferrer" class="x-handle">@ocaioalencar</a>
                        </div>
                        
                        <div style="display: flex; justify-content: center; overflow: hidden; border-radius: 12px; width: 100%;">
                            <blockquote class="twitter-tweet" data-theme="dark" data-conversation="none" data-dnt="true" style="width: 100%; margin: 0;">
                                <a href="https://x.com/ocaioalencar/status/1951077525263651112?ref_src=twsrc%5Etfw"></a>
                            </blockquote>
                            <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 6. Grid de Ações Rápidas (E-mail e Copiar Link) -->
        <section class="actions-grid">
            <div class="led-box">
                <div class="led-content">
                    <a href="mailto:caiocastro_ap@hotmail.com" class="action-btn">
                        <i class="fa-solid fa-envelope"></i> E-mail
                    </a>
                </div>
            </div>

            <div class="led-box">
                <div class="led-content">
                    <button class="action-btn" id="btn-copy" style="background: transparent; border: none; width: 100%;">
                        <i class="fa-solid fa-link"></i> Copiar Link
                    </button>
                </div>
            </div>
        </section>

        <footer class="footer">
            <div class="social-row">
                <a href="https://github.com/ocaioalencar" target="_blank" class="social-link" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://instagram.com/ocaioalencar" target="_blank" class="social-link" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://facebook.com/ocaioalencar1" target="_blank" class="social-link" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="mailto:caiocastro_ap@hotmail.com" class="social-link" title="E-mail"><i class="fa-solid fa-envelope"></i></a>
            </div>
            <span>Powered by Caio Alencar • 2026</span>
        </footer>
    </main>

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--neon-cyan);"></i>
        <span id="toast-message">Link copiado com sucesso!</span>
    </div>

    <script>
        // --- COPIAR LINK ---
        const btnCopy = document.getElementById('btn-copy');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        function showToast(msg) {
            toastMessage.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        btnCopy.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('Link do perfil copiado!');
            }).catch(() => {
                showToast('Erro ao copiar o link.');
            });
        });
    </script>
</body>
</html>
