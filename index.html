<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caio Alencar | CyberSecurity & Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #08070d;
            --card-bg: rgba(18, 16, 32, 0.65);
            --card-border: rgba(0, 243, 255, 0.2);
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --font-head: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sub);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de Fundo Interativo */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Scanlines Cyberpunk */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            opacity: 0.7;
        }

        /* Content Container */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Profile Header */
        .profile-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                        inset 0 0 15px rgba(0, 243, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            animation: scan-line 3s linear infinite;
        }

        @keyframes scan-line {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Avatar Container Animado */
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 16px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            animation: float-avatar 4s ease-in-out infinite;
        }

        @keyframes float-avatar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #121020;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.05);
            filter: contrast(1.1) brightness(1.1);
        }

        /* Canvas de partículas de pixel à volta da foto */
        #avatar-pixels {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 160px;
            height: 160px;
            pointer-events: none;
            z-index: 12;
        }

        .profile-name {
            font-family: var(--font-head);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 6px;
        }

        .profile-tag {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .profile-bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 320px;
        }

        /* Sound Equalizer Bar */
        .audio-player-widget {
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(188, 19, 254, 0.3);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .audio-player-widget:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
        }

        .audio-btn {
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }

        .eq-bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 14px;
        }

        .bar {
            width: 3px;
            height: 100%;
            background: var(--neon-purple);
            border-radius: 2px;
            transform-origin: bottom;
        }

        .playing .bar {
            animation: eq-bounce 0.8s ease-in-out infinite alternate;
        }

        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.4s; }
        .playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .playing .bar:nth-child(4) { animation-delay: 0.5s; }

        @keyframes eq-bounce {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        .audio-text {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Link Buttons Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            position: relative;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .link-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .link-card:hover::after {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 25px -5px rgba(0, 243, 255, 0.3),
                        0 0 15px rgba(0, 243, 255, 0.2);
        }

        .link-card.highlight {
            border-color: var(--neon-purple);
            background: rgba(30, 16, 48, 0.65);
        }

        .link-card.highlight:hover {
            border-color: var(--neon-pink);
            box-shadow: 0 10px 25px -5px rgba(255, 0, 127, 0.4),
                        0 0 15px rgba(255, 0, 127, 0.2);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--neon-cyan);
            transition: all 0.3s ease;
        }

        .link-card.highlight .icon-box {
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.1);
            border-color: rgba(255, 0, 127, 0.3);
        }

        .link-card:hover .icon-box {
            transform: rotate(6deg) scale(1.1);
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .link-card.highlight:hover .icon-box {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 12px var(--neon-pink);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .link-title {
            font-family: var(--font-head);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .link-subtitle {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .arrow-icon {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(4px);
            color: var(--neon-cyan);
        }

        /* Action Buttons Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .action-btn {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-main);
            font-family: var(--font-sub);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--neon-purple);
            background: rgba(188, 19, 254, 0.15);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
            transform: translateY(-2px);
        }

        .action-btn i {
            color: var(--neon-purple);
        }

        /* Footer */
        .footer {
            margin-top: 10px;
            text-align: center;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .social-row {
            display: flex;
            gap: 16px;
        }

        .social-link {
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            color: var(--neon-cyan);
            transform: translateY(-2px);
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(18, 16, 32, 0.95);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            border-radius: 30px;
            padding: 10px 24px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Media Queries */
        @media (max-width: 400px) {
            .main-container {
                padding: 16px 12px;
            }
            .profile-name {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

        <section class="links-container">

            <a href="https://facebook.com/ocaioalencar1" target="_blank" rel="noopener noreferrer" class="link-card">

        <!-- Grid de Ações Rápidas -->

                <a href="https://instagram.com/ocaioalencar" target="_blank" class="social-link" title="Instagram"><i class="fa-brands fa-instagram"></i></a>

        </footer>
    </main>

    <!-- Notification Toast -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--neon-cyan);"></i>
        <span id="toast-message">Link copiado com sucesso!</span>
    </div>

    <!-- Script de Efeitos Interativos -->
    <script>
        // --- 1. CANVAS DE PARTÍCULAS INTERATIVO ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        const mouse = { x: null, y: null, radius: 140 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.r
