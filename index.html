<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caio Alencar | CyberSecurity & Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030205; /* Fundo ainda mais escuro */
            --card-bg: rgba(10, 8, 18, 0.75);
            --card-border: rgba(0, 243, 255, 0.2);
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --font-head: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sub);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(
                rgba(10, 8, 15, 0) 50%, 
                rgba(0, 0, 0, 0.4) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.02),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.02)
            );
            background-size: 100% 4px, 6px 100%;
            opacity: 0.85;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .profile-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7),
                        inset 0 0 15px rgba(0, 243, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            animation: scan-line 3s linear infinite;
        }

        @keyframes scan-line {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 16px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            animation: float-avatar 4s ease-in-out infinite;
        }

        @keyframes float-avatar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #030205;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .avatar-wrapper:hover .avatar-img {
            transform: scale(1.05);
            filter: contrast(1.1) brightness(1.1);
        }

        .profile-name {
            font-family: var(--font-head);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 6px;
        }

        .profile-tag {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .profile-bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 320px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            position: relative;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .link-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 25px -5px rgba(0, 243, 255, 0.3);
        }

        .link-card.highlight {
            border-color: var(--neon-purple);
            background: rgba(25, 12, 40, 0.75);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--neon-cyan);
        }

        .link-card.highlight .icon-box {
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.1);
            border-color: rgba(255, 0, 127, 0.3);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .link-title {
            font-family: var(--font-head);
            font-size: 1rem;
            font-weight: 700;
        }

        .link-subtitle {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .arrow-icon {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .action-btn {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-main);
            font-family: var(--font-sub);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn:hover {
            border-color: var(--neon-purple);
            background: rgba(188, 19, 254, 0.15);
        }

        .action-btn i {
            color: var(--neon-purple);
        }

        .footer {
            margin-top: 10px;
            text-align: center;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .social-row {
            display: flex;
            gap: 16px;
        }

        .social-link {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(10, 8, 18, 0.95);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            border-radius: 30px;
            padding: 10px 24px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="scanlines"></div>

    <main class="main-container">
        <section class="profile-card">
            <div class="avatar-wrapper">
                <img src="imagem.jpg" alt="Caio Alencar" class="avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Caio'">
            </div>
            
            <h1 class="profile-name">CAIO ALENCAR</h1>
            <span class="profile-tag">&lt;CyberSecurity & Developer/&gt;</span>
            <p class="profile-bio">Criando experiências digitais interativas, automações e soluções de segurança web.</p>
        </section>

        <section class="links-container">
            <a href="https://github.com/ocaioalencar" target="_blank" rel="noopener noreferrer" class="link-card highlight">
                <div class="link-left">
                    <div class="icon-box"><i class="fa-brands fa-github"></i></div>
                    <div class="link-info">
                        <span class="link-title">GitHub</span>
                        <span class="link-subtitle">@ocaioalencar</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://instagram.com/ocaioalencar" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-left">
                    <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                    <div class="link-info">
                        <span class="link-title">Instagram</span>
                        <span class="link-subtitle">@ocaioalencar</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://facebook.com/ocaioalencar1" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-left">
                    <div class="icon-box"><i class="fa-brands fa-facebook"></i></div>
                    <div class="link-info">
                        <span class="link-title">Facebook</span>
                        <span class="link-subtitle">@ocaioalencar1</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </section>

        <section class="actions-grid">
            <a href="mailto:caiocastro_ap@hotmail.com" class="action-btn">
                <i class="fa-solid fa-envelope"></i> E-mail
            </a>
            <button class="action-btn" id="btn-copy">
                <i class="fa-solid fa-link"></i> Copiar Link
            </button>
        </section>

        <footer class="footer">
            <div class="social-row">
                <a href="https://github.com/ocaioalencar" target="_blank" class="social-link" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://instagram.com/ocaioalencar" target="_blank" class="social-link" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://facebook.com/ocaioalencar1" target="_blank" class="social-link" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="mailto:caiocastro_ap@hotmail.com" class="social-link" title="E-mail"><i class="fa-solid fa-envelope"></i></a>
            </div>
            <span>Powered by Caio Alencar • 2026</span>
        </footer>
    </main>

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--neon-cyan);"></i>
        <span id="toast-message">Link copiado com sucesso!</span>
    </div>

    <script>
        // --- BACKGROUND MAIS ESCURO COM MAIS ÍCONES FLUTUANTES ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initElements();
        });

        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Lista alargada de símbolos de código e jogos
        const symbols = [
            '{ }', '</>', '=>', '⚡', '🎮', '🕹️', '🛡️', 'bug', '404', 
            'root', '01', '</c>', 'sys', 'sudo', 'exec', 'CPU', 'RAM', 
            '1010', 'hack', 'const', 'let', 'fn()', '⚔️', '💻', 'encrypt'
        ];

        class FloatingElement {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.text = symbols[Math.floor(Math.random() * symbols.length)];
                this.fontSize = Math.floor(Math.random() * 8) + 12; // 12px a 20px
                this.vx = (Math.random() - 0.5) * 0.9;
                this.vy = (Math.random() - 0.5) * 0.9;
                
                // Cores vibrantes neon distribuídas aleatoriamente
                const colors = ['#00f3ff', '#bc13fe', '#ff007f', '#39ff14'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.4 + 0.5; // Alta visibilidade
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = `600 ${this.fontSize}px 'Fira Code', monospace`;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < -40) this.x = width + 40;
                if (this.x > width + 40) this.x = -40;
                if (this.y < -40) this.y = height + 40;
                if (this.y > height + 40) this.y = -40;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        const force = (mouse.radius - distance) / mouse.radius;
                        this.x -= (dx / distance) * force * 3;
                        this.y -= (dy / distance) * force * 3;
                    }
                }
            }
        }

        let elementsArray = [];
        function initElements() {
            elementsArray = [];
            // Densidade aumentada de ícones no ecrã (número menor no divisor = mais elementos)
            const count = Math.floor((width * height) / 12000); 
            for (let i = 0; i < count; i++) {
                elementsArray.push(new FloatingElement());
            }
        }
        initElements();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < elementsArray.length; i++) {
                elementsArray[i].update();
                elementsArray[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- COPIAR LINK ---
        const btnCopy = document.getElementById('btn-copy');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        function showToast(msg) {
            toastMessage.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        btnCopy.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('Link do perfil copiado!');
            }).catch(() => {
                showToast('Erro ao copiar o link.');
            });
        });
    </script>
</body>
</html>
